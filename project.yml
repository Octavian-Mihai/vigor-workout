name: WorkoutApp
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  WorkoutApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutApp
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.local.WorkoutApp
        PRODUCT_NAME: Workout
        PRODUCT_MODULE_NAME: WorkoutApp
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: WorkoutApp.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: HealthKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - target: WorkoutWidgets
        embed: true
    entitlements:
      path: WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.local.WorkoutApp
    scheme:
      testTargets:
        - WorkoutAppTests
        - WorkoutAppUITests
  WorkoutWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutWidgets
      - path: WorkoutApp/Shared/WidgetSnapshot.swift
      - path: WorkoutApp/Shared/RestTimerAttributes.swift
    settings:
      base:
        INFOPLIST_FILE: WorkoutWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.local.WorkoutApp.WorkoutWidgets
        PRODUCT_NAME: WorkoutWidgets
        CODE_SIGN_ENTITLEMENTS: WorkoutWidgets/WorkoutWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: WorkoutWidgets/WorkoutWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.local.WorkoutApp
  WorkoutAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutAppTests
      - path: contract
        name: Contract
    dependencies:
      - target: WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.WorkoutAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkoutApp
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Workout.app/Workout"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
  WorkoutAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutAppUITests
    dependencies:
      - target: WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.WorkoutAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkoutApp
        CODE_SIGNING_ALLOWED: NO
